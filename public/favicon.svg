  <line x1="33" y1="19" x2="33" y2="45" stroke="#a78bfa" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="44" y1="27" x2="44" y2="49" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="2 2" />
  <!-- Top floating Violet island (Avantgarde) -->
  <ellipse cx="33" cy="18" rx="11.5" ry="5" fill="#8b5cf6" fill-opacity="0.88" stroke="#ddd6fe" stroke-width="1.4" />
  <!-- Right floating Cyan island (Digital-Adaptiv) -->
  <ellipse cx="44" cy="27" rx="10" ry="4.4" fill="#06b6d4" fill-opacity="0.88" stroke="#bae6fd" stroke-width="1.4" />
  <!-- Left floating Emerald island (Resilienz) -->
